<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DejaVu Tools Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #ffffff;
            --bg-surface: #fff5f5;
            --accent-1: #dc2626;
            --accent-2: #ef4444;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: rgba(220, 38, 38, 0.15);
        }
        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(220,38,38,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(239,68,68,0.04) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(220,38,38,0.03) 0%, transparent 50%);
            z-index: -1;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
        }
        .navbar-links { display: flex; gap: 32px; align-items: center; }
        .navbar-links a {
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            font-size: 14px;
        }
        .navbar-links a:hover, .navbar-links a.active { color: #dc2626; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.05);
        }
        .glass-panel:hover {
            border-color: rgba(220, 38, 38, 0.4);
            box-shadow: 0 8px 30px rgba(220, 38, 38, 0.1);
        }
        .btn-glow {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-glow:hover { transform: translateY(-2px); }
        .btn-small {
            background: #dc2626;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 12px;
            transition: opacity 0.3s;
        }
        .btn-small:hover { opacity: 0.8; }
        .page { display: none; min-height: calc(100vh - 80px); padding: 64px 32px; }
        .page.active { display: block; }
        .container { max-width: 1200px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 80px; }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #dc2626, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-bottom: 80px; }
        .stat-card { text-align: center; }
        .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            color: #dc2626;
        }
        .stat-label { color: var(--text-muted); font-size: 14px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 245, 245, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #dc2626;
        }
        .output-cards { display: grid; gap: 16px; margin-top: 32px; }
        .card-item {
            background: rgba(255, 245, 245, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-break: break-all;
        }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 32px; }
        .result-card {
            background: rgba(255, 245, 245, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .result-card p { margin-bottom: 8px; font-size: 14px; }
        .result-card strong { color: #dc2626; }
        @media (max-width: 768px) {
            .hero h1 { font-size: 40px; }
            .stats { grid-template-columns: 1fr; }
            .card-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand" onclick="navigate('/')">⚡ DejaVu</div>
        <div class="navbar-links">
            <a onclick="navigate('/')" class="nav-link active" data-page="landing">Home</a>
            <a onclick="navigate('/generate')" class="nav-link" data-page="generate">Generate</a>
            <a onclick="navigate('/bin-lookup')" class="nav-link" data-page="bin-lookup">BIN Lookup</a>
            <a onclick="navigate('/address')" class="nav-link" data-page="address">Address</a>
        </div>
    </nav>

    <div id="landing" class="page active">
        <div class="container">
            <div class="hero">
                <h1>⚡ DejaVu Tools Card</h1>
                <p style="font-size: 18px; color: var(--text-muted); margin-bottom: 32px;">Generate. Validate. Dominate.</p>
            </div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="stat-cards">0</div>
                    <div class="stat-label">Cards Generated</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-countries">50</div>
                    <div class="stat-label">Countries</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="stat-valid">0</div>
                    <div class="stat-label">Luhn Valid</div>
                </div>
            </div>
        </div>
    </div>

    <div id="generate" class="page">
        <div class="container">
            <h2 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 32px;">💳 Credit Card Generator</h2>
            <div class="glass-panel" style="max-width: 600px; margin: 0 auto 64px;">
                <div class="form-group">
                    <label>BIN Prefix (optional, 6-8 digits)</label>
                    <input type="text" id="binInput" placeholder="515462" value="515462">
                </div>
                <div class="form-group">
                    <label>Quantity (1-100)</label>
                    <input type="number" id="quantity" min="1" max="100" value="10">
                </div>
                <div class="form-group">
                    <label>Network</label>
                    <select id="network">
                        <option value="visa">Visa</option>
                        <option value="mastercard" selected>Mastercard</option>
                        <option value="amex">American Express</option>
                    </select>
                </div>
                <button class="btn-glow" onclick="generateCards()" style="width: 100%;">⚡ GENERATE CARDS</button>
            </div>
            <div id="output"></div>
        </div>
    </div>

    <div id="bin-lookup" class="page">
        <div class="container">
            <h2 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 32px;">🔍 BIN Lookup</h2>
            <div class="glass-panel" style="max-width: 600px; margin: 0 auto 64px;">
                <div class="form-group">
                    <label>Enter BIN (6 digits)</label>
                    <input type="text" id="binLookup" placeholder="515462" maxlength="8">
                </div>
                <button class="btn-glow" onclick="lookupBin()" style="width: 100%;">🔍 LOOKUP</button>
            </div>
            <div id="binResult"></div>
        </div>
    </div>

    <div id="address" class="page">
        <div class="container">
            <h2 style="font-family: 'Space Grotesk', sans-serif; margin-bottom: 32px;">🏠 Address Generator</h2>
            <div class="glass-panel" style="max-width: 600px; margin: 0 auto 64px;">
                <div class="form-group">
                    <label>Country</label>
                    <select id="countrySelect">
                        <option value="kr">South Korea</option>
                    </select>
                </div>
                <button class="btn-glow" onclick="generateAddress()" style="width: 100%; margin-bottom: 12px;">🏠 GENERATE ADDRESS</button>
                <button class="btn-glow" onclick="copyAllAddress()" style="width: 100%; background: rgba(124, 58, 237, 0.5);">📋 COPY ALL</button>
            </div>
            <div id="addressResult"></div>
        </div>
    </div>

    <script>
        

        let currentAddress = null;
        let cardsGenerated = 0;
        let luhnValid = 0;

        function luhnCheck(num) {
            let sum = 0, isEven = false;
            for (let i = num.length - 1; i >= 0; i--) {
                let digit = parseInt(num[i], 10);
                if (isEven) { digit *= 2; if (digit > 9) digit -= 9; }
                sum += digit;
                isEven = !isEven;
            }
            return sum % 10 === 0;
        }

        function generateLuhn(bin) {
            const length = 16;
            let num = bin + '0'.repeat(length - bin.length - 1);
            let sum = 0, isEven = false;
            for (let i = num.length - 1; i >= 0; i--) {
                let digit = parseInt(num[i], 10);
                if (isEven) { digit *= 2; if (digit > 9) digit -= 9; }
                sum += digit;
                isEven = !isEven;
            }
            const checkDigit = (10 - (sum % 10)) % 10;
            return num + checkDigit;
        }

        function getRandomName() {
            const names = ['John Smith', 'Jane Doe', 'Michael Johnson', 'Sarah Williams', 'Robert Brown', 'Emily Davis', 'David Miller', 'Lisa Anderson'];
            return names[Math.floor(Math.random() * names.length)];
        }

        function navigate(page) {
            const pageId = page === '/' ? 'landing' : page.replace(/^[#\/]+/, '');
            const pageEl = document.getElementById(pageId);
            if (!pageEl) return;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            pageEl.classList.add('active');
            const link = document.querySelector(`[data-page="${pageId}"]`);
            if (link) link.classList.add('active');
            const newHash = page === '/' ? '' : '#' + pageId;
            if (window.location.hash !== newHash) window.location.hash = newHash;
        }

        function generateCards() {
            const bin = document.getElementById('binInput').value || '515462';
            const qty = Math.min(parseInt(document.getElementById('quantity').value) || 10, 100);
            const network = document.getElementById('network').value;

            if (!bin || bin.length < 6) { alert('Enter valid BIN (6+ digits)'); return; }

            let cards = [];
            for (let i = 0; i < qty; i++) {
                const cardNum = generateLuhn(bin);
                const month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
                const year = String(Math.floor(Math.random() * 6) + 27).padStart(2, '0');
                const cvv = String(Math.floor(Math.random() * 900) + 100);
                const name = getRandomName();
                cards.push({ number: cardNum, expiry: `${month}/${year}`, cvv, name });
                if (luhnCheck(cardNum)) luhnValid++;
            }

            cardsGenerated += qty;
            document.getElementById('stat-cards').textContent = cardsGenerated;
            document.getElementById('stat-valid').textContent = luhnValid;

            let output = '<div class="glass-panel"><h3 style="margin-bottom: 16px;">Generated ' + qty + ' Cards</h3>';
            output += '<div class="output-cards">';
            cards.forEach(card => {
                const cardStr = `${card.number} | ${card.expiry} | ${card.cvv} | ${card.name}`;
                output += `<div class="card-item"><span>${cardStr}</span><button class="btn-small" onclick="navigator.clipboard.writeText('${cardStr}')">📋 Copy</button></div>`;
            });
            output += '</div></div>';
            document.getElementById('output').innerHTML = output;
        }

        function lookupBin() {
            const bin = document.getElementById('binLookup').value;
            if (!bin || bin.length < 6) { alert('Enter valid BIN (6+ digits)'); return; }

            fetch(`https://lookup.binlist.net/${bin}`)
                .then(r => r.json())
                .then(data => {
                    const result = `<div class="glass-panel">
                        <h3 style="margin-bottom: 16px;">BIN: ${bin}</h3>
                        <p><strong>Bank:</strong> ${data.bank?.name || 'Unknown'}</p>
                        <p><strong>Country:</strong> ${data.country?.name || 'Unknown'} (${data.country?.alpha2 || 'N/A'})</p>
                        <p><strong>Type:</strong> ${data.type || 'Unknown'}</p>
                        <p><strong>Brand:</strong> ${data.brand || 'Unknown'}</p>
                        <p><strong>Currency:</strong> ${data.country?.currency || 'Unknown'}</p>
                    </div>`;
                    document.getElementById('binResult').innerHTML = result;
                })
                .catch(e => {
                    document.getElementById('binResult').innerHTML = '<div class="glass-panel"><p style="color: #ef4444;">BIN not found or API error</p></div>';
                });
        }

        function generateAddress() {
            currentAddress = KOREA_ADDRESSES[Math.floor(Math.random() * KOREA_ADDRESSES.length)];
            const result = `<div class="glass-panel">
                <h3 style="margin-bottom: 16px;">Generated Address</h3>
                <div class="result-card">
                    <p><strong>Name:</strong> ${currentAddress.name}</p>
                    <p><strong>Address:</strong> ${currentAddress.address}</p>
                    <p><strong>City:</strong> ${currentAddress.city}</p>
                    <p><strong>Country:</strong> ${currentAddress.country}</p>
                    <p><strong>ZIP:</strong> ${currentAddress.zip}</p>
                    <p><strong>Phone:</strong> ${currentAddress.phone}</p>
                    <p><strong>Email:</strong> ${currentAddress.email}</p>
                </div>
            </div>`;
            document.getElementById('addressResult').innerHTML = result;
        }

        function copyAllAddress() {
            if (!currentAddress) { alert('Generate address first'); return; }
            const text = `Name: ${currentAddress.name}\nAddress: ${currentAddress.address}\nCity: ${currentAddress.city}\nCountry: ${currentAddress.country}\nZIP: ${currentAddress.zip}\nPhone: ${currentAddress.phone}\nEmail: ${currentAddress.email}`;
            navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard'));
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '') || '/';
            navigate(hash);
        });
        if (window.location.hash) navigate(window.location.hash.replace('#', ''));
    </script>
</body>
</html>
